name: R-CMD-check

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: R-CMD-check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Ensembl 107 annotation (AnnotationHub) and MSigDB (ExperimentHub)
      - name: Set hub cache directories
        shell: bash
        run: |
          echo "ANNOTATION_HUB_CACHE=${{ runner.temp }}/hubs/AnnotationHub" >> "$GITHUB_ENV"
          echo "EXPERIMENT_HUB_CACHE=${{ runner.temp }}/hubs/ExperimentHub" >> "$GITHUB_ENV"
          echo "HUB_CACHE_MONTH=$(date +%Y-%m)" >> "$GITHUB_ENV"

      # A new key each month saves the refreshed hub metadata; earlier
      # months' caches are restored as a starting point
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hubs
          key: hubs-${{ runner.os }}-AH104864-msigdb-2023.1-${{ env.HUB_CACHE_MONTH }}
          restore-keys: hubs-${{ runner.os }}-AH104864-msigdb-2023.1-

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
